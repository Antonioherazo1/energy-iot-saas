server {
    listen 80;
    server_name thinc.site;

    # Firmware: serve over HTTP without redirect (ESP32 can't do HTTPS redirects)
    location /firmware/ {
        proxy_pass http://127.0.0.1:8000/firmware/;
        proxy_set_header Host $host;
    }

    # Everything else: redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name thinc.site;

    ssl_certificate /etc/letsencrypt/live/thinc.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thinc.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/thinc;
    index index.html;

    location /api/v1/ {
        client_max_body_size 50M;
        proxy_pass http://127.0.0.1:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /firmware/ {
        proxy_pass http://127.0.0.1:8000/firmware/;
        proxy_set_header Host $host;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
