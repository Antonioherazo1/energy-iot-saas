services:
  api:
    build: .
    container_name: energy_iot_api
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      MQTT_ENABLED: "true"
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      FIRMWARE_BASE_URL: http://thinc.site/firmware
    depends_on:
      - postgres
      - mosquitto
    restart: unless-stopped
    volumes:
      - firmware_data:/app/firmware

  postgres:
    image: postgres:16-alpine
    container_name: energy_iot_postgres
    command: postgres -c shared_preload_libraries=pg_stat_statements
    environment:
      POSTGRES_DB: energy_iot
      POSTGRES_USER: energy_iot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: energy_iot_mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
  firmware_data:
